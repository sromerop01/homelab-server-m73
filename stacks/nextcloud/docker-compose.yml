services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=cambiame123        # Cambiar antes de desplegar
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=cambiame123  # Cambiar antes de desplegar
      - NEXTCLOUD_TRUSTED_DOMAINS=192.168.1.75
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: nextcloud-mysql
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootcambiame123  # Cambiar antes de desplegar
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=cambiame123           # Cambiar antes de desplegar

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped

volumes:
  nextcloud_data:
  mysql_data:
